<!--
Crie uma página com 4 links, cada um representando o nome de uma cor, que, utilizando o 
evento  onmouseover  altere  a  cor  do  plano  de  fundo  para  cor  correspondente  (dica  utilize  o 
atributo style="background-color: red;").
-->

<!DOCTYPE html>
    <html lang="port-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Questão 2</title>
    </head>
    <body>
        <nav>
            <a href="#" onmouseover="document.body.style.backgroundColor='red';">Vermelho</a>
            <a href="#" onmouseover="document.body.style.backgroundColor='blue';">Azul</a>
            <a href="#" onmouseover="document.body.style.backgroundColor='green';">Verde</a>
            <a href="#" onmouseover="document.body.style.backgroundColor='yellow';">Amarelo</a>
        </nav>
    </body>
</html>
