<!--
Crie um formulário simples com 4 botões e um parágrafo que, ao clicar em cada um, altere o 
texto do parágrafo para vermelho, verde, azul e amarelo, respectivamente. 
-->
<!DOCTYPE html>
    <html lang="port-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Questão 1</title>
    </head>
    <body>
        <p id ="Texto">
            Olá, aperte o botão para mudar minha cor
        </p>
        <button id="Vermelho" onclick="mudacor('red')">Vermelho</button>
        <button id="Verde" onclick="mudacor('green')">Verde</button>
        <button id="Azul" onclick="mudacor('blue')">Azul</button>
        <button id="Amarelo" onclick="mudacor('yellow')">Amarelo</button>

        <script src="Script.js"></script>
        
    </body>
</html>
