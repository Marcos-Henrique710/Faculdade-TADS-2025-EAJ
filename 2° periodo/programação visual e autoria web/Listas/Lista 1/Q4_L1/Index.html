<!--
Crie  um formulário com os campos para cadastrar o usuário de  um sistema (login, senha e 
confirmar senha).
-->

<!DOCTYPE html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Questão 4</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h2>Login</h2>

        <form id="loginForm">
            <label for="email">E-mail:</label><br>
            <input type="email" id="email" name="email" placeholder="exemplo@gmail.com" required><br><br>

            <label for="senha">Senha:</label><br>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required><br><br>

            <button type="submit">Entrar</button>
        </form>

        <p id="mensagem"></p>

        <script src="script.js"></script>
    </body>
</html>
