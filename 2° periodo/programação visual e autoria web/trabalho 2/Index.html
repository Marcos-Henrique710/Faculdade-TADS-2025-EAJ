<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CoffeeShop — Loja</title>
  <!-- Bootstrap CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --max-img-height: 180px; }
    body { background: #f8f9fa; }
    .coffee-card img { max-height: var(--max-img-height); width:100%; object-fit:cover; }
    .ingredient-badge { margin-right: 4px; }
    .cart-badge { position: relative; top: -10px; left: -6px; }
    .pointer { cursor: pointer; }
    main { padding: 1.25rem 0; }
    footer { padding: 1rem 0; text-align:center; color: #6c757d; }
    .visually-hidden-focusable:focus { outline: 3px solid rgba(13,110,253,.25); border-radius: .25rem; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
  /**************************************************************************
   * index.html — SPA (HTML + Vanilla JS)
   * Requirements:
   * - Consome json-server (endpoint /coffee ou /cafes)
   * - Carrinho persistido em localStorage
   * - Páginas: loja (listagem), carrinho, checkout
   **************************************************************************/

  // ---------- Utilitários ----------
  const $ = s => document.querySelector(s);
  const money = v => (typeof v === 'number' ? v.toLocaleString('pt-BR', {style:'currency', currency:'BRL'}) : v);

  const CART_KEY = 'cart';
  function loadCart(){ try { const r = localStorage.getItem(CART_KEY); return r ? JSON.parse(r) : {}; } catch { return {}; } }
  function saveCart(cart){ localStorage.setItem(CART_KEY, JSON.stringify(cart)); }
  function cartCount(){ return Object.values(loadCart()).reduce((s,i) => s + (i.qty||0), 0); }
  function cartTotal(){ return Object.values(loadCart()).reduce((s,i) => s + (i.qty * i.price), 0); }

  // ---------- API ----------
  const API_URL = 'http://localhost:3000/coffee';
  async function fetchCoffees(){
    try {
      const res = await fetch(API_URL, {cache: 'no-store'});
      if (!res.ok) throw new Error('Resposta não OK');
      const data = await res.json();
      if (Array.isArray(data)) return data;
      if (Array.isArray(data.coffee)) return data.coffee;
      if (Array.isArray(data.cafes)) return data.cafes;
      return fallback();
    } catch (err) {
      console.warn('Falha ao buscar API — usando fallback.', err);
      return fallback();
    }
  }

  function fallback(){
    return [
      { id:1, title:'Black Coffee', description:'Café preto puro.', ingredients:['Café'], price:3.0, image:'https://images.unsplash.com/photo-1494314671902-399b18174975?auto=format&fit=crop&q=80&w=800' },
      { id:2, title:'Latte', description:'Espresso com leite vaporizado.', ingredients:['Espresso','Leite'], price:4.5, image:'https://images.unsplash.com/photo-1561882468-9110e03e0f78?auto=format&fit=crop&q=80&w=800' }
    ];
  }

  // ---------- Sanitizadores ----------
  function esc(s){ if (s===null||s===undefined) return ''; return String(s).replace(/[&<>"'`=\/]/g, c=>'&' + ({'&':'amp','<':'lt','>':'gt','"':'quot',"'":'#39','/':'#x2F','`':'#96','=':'#61'}[c]) + ';'); }
  function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }

  // ---------- Templates ----------
  function headerTemplate(){
    return `
      <header class="bg-white shadow-sm">
        <nav class="container d-flex align-items-center justify-content-between py-2">
          <a class="text-decoration-none d-flex align-items-center gap-2" href="#/">
            <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/2615.png" alt="" style="width:34px;height:34px">
            <span class="fs-5 fw-semibold text-dark">CoffeeShop</span>
          </a>
          <div class="d-flex align-items-center gap-3">
            <button id="btn-home" class="btn btn-link text-dark">Loja</button>
            <div class="position-relative">
              <button id="btn-cart" class="btn btn-outline-primary d-flex align-items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-cart3" viewBox="0 0 16 16"><path d="M0 1a1 1 0 0 1 1-1h1.11a1 1 0 0 1 .98.804L3.89 3H14a1 1 0 0 1 .98 1.197l-1.2 6A1 1 0 0 1 12.8 11H4.4a1 1 0 0 1-.98-.804L1.61 1.607 1.1 1H1a1 1 0 0 1-1-1z"/></svg>
                Carrinho <span id="cart-count" class="badge bg-danger cart-badge">${cartCount()}</span>
              </button>
            </div>
          </div>
        </nav>
      </header>
    `;
  }

  function footerTemplate(){
    return `<footer><div class="container"><small>Trabalho 3 — Front End para uma Loja</small></div></footer>`;
  }

  function storeTemplate(coffees){
    const cards = coffees.map(c => `
      <div class="col-sm-6 col-md-4 col-lg-3 mb-4">
        <article class="card h-100 coffee-card">
          <img src="${escAttr(c.image||'')}" alt="${escAttr(c.title)}" class="card-img-top" onerror="this.src='https://via.placeholder.com/400x250?text=Imagem'">
          <div class="card-body d-flex flex-column">
            <h6 class="card-title mb-1">${esc(c.title)}</h6>
            <p class="card-text text-muted small mb-2">${esc(c.description||'')}</p>
            <div class="mb-2">${(c.ingredients||[]).map(i=>`<span class="badge bg-secondary ingredient-badge">${esc(i)}</span>`).join(' ')}</div>
            <div class="mt-auto d-flex justify-content-between align-items-center">
              <strong>${money(c.price)}</strong>
              <button class="btn btn-sm btn-primary add-to-cart" data-id="${escAttr(c.id)}" data-title="${escAttr(c.title)}" data-price="${c.price}" data-img="${escAttr(c.image||'')}">Adicionar</button>
            </div>
          </div>
        </article>
      </div>
    `).join('');
    return `
      <main class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h5 m-0">Produtos</h2>
          <div class="text-muted small">Lista carregada da API local</div>
        </div>
        <div class="row">${cards}</div>
      </main>
    `;
  }

  function cartTemplate(){
    const cart = loadCart();
    const items = Object.values(cart);
    if (!items.length) return `
      <main class="container">
        <h2 class="h5 mb-3">Carrinho</h2>
        <div class="alert alert-info">Seu carrinho está vazio. Volte à loja para adicionar produtos.</div>
      </main>
    `;
    const rows = items.map(it => `
      <li class="list-group-item d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-3">
          <img src="${escAttr(it.image||'')}" alt="${escAttr(it.title)}" style="width:64px;height:48px;object-fit:cover" onerror="this.src='https://via.placeholder.com/64x48?text=IMG'">
          <div>
            <div class="fw-semibold">${esc(it.title)}</div>
            <div class="small text-muted">${money(it.price)}</div>
          </div>
        </div>
        <div class="d-flex align-items-center gap-2">
          <div class="input-group input-group-sm" style="width:120px">
            <button class="btn btn-outline-secondary decrease-qty" data-id="${escAttr(it.id)}">−</button>
            <input class="form-control form-control-sm text-center qty-input" data-id="${escAttr(it.id)}" value="${it.qty}" />
            <button class="btn btn-outline-secondary increase-qty" data-id="${escAttr(it.id)}">+</button>
          </div>
          <div class="text-end ms-2" style="min-width:120px">
            <div><strong>${money(it.qty * it.price)}</strong></div>
            <button class="btn btn-link text-danger remove-item" data-id="${escAttr(it.id)}">Remover</button>
          </div>
        </div>
      </li>
    `).join('');
    return `
      <main class="container">
        <h2 class="h5 mb-3">Carrinho</h2>
        <ul class="list-group mb-3">${rows}</ul>
        <div class="d-flex justify-content-between align-items-center">
          <div><strong>Total:</strong> ${money(cartTotal())}</div>
          <div>
            <a href="#/checkout" class="btn btn-success">Finalizar Compra</a>
            <button id="clear-cart" class="btn btn-outline-danger">Limpar Carrinho</button>
          </div>
        </div>
      </main>
    `;
  }

  function checkoutTemplate(){
    const cart = loadCart();
    const items = Object.values(cart);
    if (!items.length) return `
      <main class="container">
        <h2 class="h5 mb-3">Finalização</h2>
        <div class="alert alert-info">Seu carrinho está vazio.</div>
      </main>`;
    const list = items.map(it=>`<li class="list-group-item d-flex justify-content-between"><div>${esc(it.title)} <small class="text-muted">x${it.qty}</small></div><div>${money(it.qty*it.price)}</div></li>`).join('');
    return `
      <main class="container">
        <h2 class="h5 mb-3">Finalização de Compra</h2>
        <div class="row">
          <div class="col-md-6">
            <h6>Itens</h6>
            <ul class="list-group mb-3">
              ${list}
              <li class="list-group-item d-flex justify-content-between"><strong>Total</strong><strong>${money(cartTotal())}</strong></li>
            </ul>
          </div>
          <div class="col-md-6">
            <h6>Dados de entrega</h6>
            <form id="checkout-form" novalidate>
              <div class="mb-3">
                <label class="form-label">Endereço</label>
                <input id="addr" class="form-control" required />
                <div class="invalid-feedback">Informe o endereço de entrega.</div>
              </div>
              <div class="mb-3">
                <label class="form-label">Pagamento</label>
                <select id="payment" class="form-select" required>
                  <option value="">Selecione...</option>
                  <option value="card">Cartão de crédito</option>
                  <option value="pix">PIX</option>
                  <option value="boleto">Boleto</option>
                </select>
                <div class="invalid-feedback">Escolha uma forma de pagamento.</div>
              </div>
              <div class="d-flex gap-2">
                <button class="btn btn-primary" type="submit">Confirmar Pedido</button>
                <a class="btn btn-outline-secondary" href="#/cart">Voltar</a>
              </div>
            </form>
            <div id="checkout-msg" class="mt-3"></div>
          </div>
        </div>
      </main>
    `;
  }

  // ---------- Router & Render ----------
  let coffeesCache = null;
  async function render(){
    const root = document.getElementById('root');
    const hash = location.hash.replace('#','') || '/';
    let html = '';
    html += headerTemplate();

    if (hash === '/' || hash === '') {
      if (!coffeesCache) coffeesCache = await fetchCoffees();
      html += storeTemplate(coffeesCache);
    } else if (hash.startsWith('/cart')) {
      html += cartTemplate();
    } else if (hash.startsWith('/checkout')) {
      html += checkoutTemplate();
    } else {
      html += `<main class="container"><h2>404</h2><p>Página não encontrada.</p></main>`;
    }

    html += footerTemplate();
    root.innerHTML = html;
    bindEvents();
    updateCartBadge();
  }

  window.addEventListener('hashchange', render);
  render();

  // ---------- Events ----------
  function updateCartBadge(){ const el = document.getElementById('cart-count'); if (el) el.textContent = cartCount(); }

  function bindEvents(){
    document.querySelectorAll('.add-to-cart').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = String(btn.dataset.id);
        const title = btn.dataset.title;
        const price = Number(btn.dataset.price) || 0;
        const image = btn.dataset.img || '';
        const cart = loadCart();
        if (!cart[id]) cart[id] = { id, title, price, qty:0, image };
        cart[id].qty = (cart[id].qty||0) + 1;
        saveCart(cart);
        updateCartBadge();
        btn.classList.add('btn-success');
        setTimeout(()=>btn.classList.remove('btn-success'), 350);
      });
    });

    const btnHome = document.getElementById('btn-home');
    if (btnHome) btnHome.addEventListener('click', ()=> location.hash = '#/');

    const btnCart = document.getElementById('btn-cart');
    if (btnCart) btnCart.addEventListener('click', ()=> location.hash = '#/cart');

    document.querySelectorAll('.increase-qty').forEach(b=> b.addEventListener('click', ()=>{
      const id = b.dataset.id;
      const cart = loadCart();
      if (cart[id]) { cart[id].qty++; saveCart(cart); render(); }
    }));
    document.querySelectorAll('.decrease-qty').forEach(b=> b.addEventListener('click', ()=>{
      const id = b.dataset.id;
      const cart = loadCart();
      if (cart[id]) {
        cart[id].qty = Math.max(0, cart[id].qty - 1);
        if (cart[id].qty === 0) delete cart[id];
        saveCart(cart); render();
      }
    }));
    document.querySelectorAll('.remove-item').forEach(b=> b.addEventListener('click', ()=>{
      const id = b.dataset.id;
      const cart = loadCart();
      if (cart[id]) { delete cart[id]; saveCart(cart); render(); }
    }));
    document.querySelectorAll('.qty-input').forEach(inp=> inp.addEventListener('change', ()=>{
      const id = inp.dataset.id;
      const v = parseInt(inp.value) || 0;
      const cart = loadCart();
      if (v <= 0) { delete cart[id]; } else cart[id].qty = v;
      saveCart(cart); render();
    }));

    const clearBtn = document.getElementById('clear-cart');
    if (clearBtn) clearBtn.addEventListener('click', ()=> {
      if (confirm('Deseja limpar o carrinho?')) { localStorage.removeItem(CART_KEY); render(); }
    });

    const checkoutForm = document.getElementById('checkout-form');
    if (checkoutForm) {
      checkoutForm.addEventListener('submit', (ev)=>{
        ev.preventDefault();
        const addr = document.getElementById('addr');
        const payment = document.getElementById('payment');
        let ok = true;
        if (!addr.value.trim()) { addr.classList.add('is-invalid'); ok = false; } else addr.classList.remove('is-invalid');
        if (!payment.value) { payment.classList.add('is-invalid'); ok = false; } else payment.classList.remove('is-invalid');
        if (!ok) return;
        const snapshot = { items: Object.values(loadCart()), total: cartTotal(), address: addr.value.trim(), payment: payment.value, date: new Date().toISOString() };
        // Aqui poderíamos POSTar para um backend. Por enquanto apenas confirmamos e limpamos o carrinho.
        localStorage.removeItem(CART_KEY);
        const msg = document.getElementById('checkout-msg');
        if (msg) msg.innerHTML = `<div class="alert alert-success"><h6>Pedido confirmado</h6><p>Total: <strong>${money(snapshot.total)}</strong><br>Entrega: ${esc(snapshot.address)}<br>Pagamento: ${esc(snapshot.payment)}</p></div>`;
        setTimeout(()=> { location.hash = '#/'; render(); }, 1500);
      });
    }

    // Tornar badge reativo a mudanças em outras abas
    window.addEventListener('storage', (e)=> { if (e.key === CART_KEY) updateCartBadge(); });
  }

  </script>
</body>
</html>
